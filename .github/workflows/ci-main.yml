name: Main CD (App only)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  deploy-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1) jar 생성
      - name: Build bootJar
        run: ./gradlew clean bootJar

      # 2) GHCR 로그인
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 3) 이미지 빌드 & 푸시
      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce:${{ github.sha }}

      # 4) EC2에서 pull/run
      - name: Deploy on EC2 (pull & run)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce:latest

            docker stop ecommerce || true
            docker rm ecommerce || true

            docker run -d --name ecommerce \
              --restart unless-stopped \
              -p 8080:8080 \
              ghcr.io/${{ secrets.GHCR_USERNAME }}/ecommerce:latest

            docker image prune -f